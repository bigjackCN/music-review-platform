spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/music_review}
    username: ${DB_USERNAME:music_admin}
    password: ${DB_PASSWORD:music_pass}
    driver-class-name: org.postgresql.Driver

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:this-is-a-very-long-secret-key-for-jwt-signing-change-me}